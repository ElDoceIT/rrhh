<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>if(localStorage.getItem("app_theme")==="dark"){document.documentElement.dataset.theme="dark"}</script>
  <title>Ingreso · RRHH</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-panel">
      <div class="login-brand">
        <img src="{{ url_for('static', path='/logoc12_1.png') }}" alt="Canal Doce" width="48" height="48">
        <div>
          <span class="eyebrow">RRHH</span>
          <h1>Horas extras</h1>
        </div>
      </div>

      <p class="login-copy">Ingresá con tu usuario de red o con una cuenta local habilitada.</p>

      {% if error %}<div class="alert error login-alert"><i class="bi bi-exclamation-triangle-fill"></i> {{ error }}</div>{% endif %}

      <form method="post" action="/login" class="login-form">
        <input type="hidden" name="next_url" value="{{ next_url }}">
        <label class="field">
          <span>Usuario</span>
          <input name="username" maxlength="100" autocomplete="username" required autofocus value="{{ username or '' }}" placeholder="Ingresá tu usuario">
        </label>
        <label class="field">
          <span>Contraseña</span>
          <input type="password" name="password" autocomplete="current-password" required placeholder="Contraseña">
        </label>
        <button class="ui-btn primary-btn login-submit" type="submit"><i class="bi bi-box-arrow-in-right"></i> Ingresar</button>
      </form>

      <p class="login-access-note"><i class="bi bi-shield-lock"></i> El tipo de acceso se detecta automáticamente.</p>
    </section>
  </main>
  <script src="{{ url_for('static', path='/js/app.js') }}"></script>
</body>
</html>
