{% macro time_select(name, value='', kind='') -%}
{% set current_value = value or '00:00' %}
<span class="time-select-control" data-time-select>
  <select data-time-hour required aria-label="Hora">
    {% for hour in range(24) %}{% set hour_value = '%02d'|format(hour) %}<option value="{{ hour_value }}" {% if current_value[:2] == hour_value %}selected{% endif %}>{{ hour_value }}</option>{% endfor %}
  </select>
  <b>:</b>
  <select data-time-minute required aria-label="Minutos">
    <option value="" disabled>Min</option>
    <option value="00" {% if current_value[3:5] == '00' %}selected{% endif %}>00</option>
    <option value="30" {% if current_value[3:5] == '30' %}selected{% endif %}>30</option>
  </select>
  <input type="hidden" name="{{ name }}" value="{{ current_value }}" {% if kind == 'start' %}data-start-time{% elif kind == 'end' %}data-end-time{% elif kind == 'journey-start' %}data-journey-start-time{% elif kind == 'journey-end' %}data-journey-end-time{% endif %}>
</span>
{%- endmacro %}
